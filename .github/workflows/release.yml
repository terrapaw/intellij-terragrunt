name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Test
        run: ./gradlew buildPlugin test

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BUILD_VERSION=$(grep '^version' build.gradle.kts | sed 's/.*"\(.*\)"/\1/')
          if [ "$TAG_VERSION" != "$BUILD_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match build.gradle.kts version ($BUILD_VERSION)"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d')
          if [ -z "$NOTES" ]; then
            echo "::error::No release notes found for version $VERSION in CHANGELOG.md. Rename [Unreleased] to [$VERSION] before tagging."
            exit 1
          fi
          echo "$NOTES" > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/distributions/*.zip
          body_path: /tmp/release-notes.md

      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
