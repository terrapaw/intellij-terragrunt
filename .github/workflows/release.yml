name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determine release channel
        id: channel
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"-rc"* ]]; then
            echo "channel=beta" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "channel=default" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and Test
        run: ./gradlew buildPlugin test

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BUILD_VERSION=$(grep '^version' build.gradle.kts | sed 's/.*"\(.*\)"/\1/')
          if [ "$TAG_VERSION" != "$BUILD_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match build.gradle.kts version ($BUILD_VERSION)"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # For beta/rc tags, use [Unreleased] section
          if [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            NOTES=$(sed -n '/^## \[Unreleased\]/,/^## \[/p' CHANGELOG.md | sed '1d;$d')
          else
            NOTES=$(sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d')
          fi
          if [ -z "$NOTES" ]; then
            echo "::error::No release notes found. For stable: rename [Unreleased] to [$VERSION]. For beta: ensure [Unreleased] has content."
            exit 1
          fi
          echo "$NOTES" > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/distributions/*.zip
          body_path: /tmp/release-notes.md
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}

      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          PUBLISH_CHANNEL: ${{ steps.channel.outputs.channel }}
